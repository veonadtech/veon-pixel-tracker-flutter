name: Setup
description: Setup Flutter and Java for plugin development

runs:
  using: composite
  steps:
    - name: Setup Java
      uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
      with:
        distribution: zulu
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@fd55f4fc44f3e3cbeb8a8da5b0e2a90e1b08c090 # v2.21.0
      with:
        channel: stable
        cache: true
        cache-key: flutter-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}

    - name: Restore pub cache
      id: pub-cache
      uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: |
          ~/.pub-cache
        key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pub-

    - name: Install dependencies
      if: steps.pub-cache.outputs.cache-hit != 'true'
      run: flutter pub get
      shell: bash

    - name: Cache pub dependencies
      if: steps.pub-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: |
          ~/.pub-cache
        key: ${{ steps.pub-cache.outputs.cache-primary-key }}